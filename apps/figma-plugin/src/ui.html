<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Pixso 迁移修复工具</title>
  </head>
  <body>
    <main>
      <h1>Pixso 迁移修复工具</h1>
      <label>迁移数据文件 <input id="file" type="file" accept=".json,application/json"></label>
      <textarea id="json" placeholder="请选择 migration-map.json，也可以在这里粘贴内容"></textarea>
      <div class="actions">
        <button id="preview">仅扫描预览</button>
        <button id="repair">执行安全修复</button>
      </div>
      <section id="summary"></section>
      <ol id="results"></ol>
    </main>
    <style>
      body { font: 12px system-ui, sans-serif; margin: 16px; }
      textarea { width: 100%; height: 240px; box-sizing: border-box; }
      .actions { display: flex; gap: 8px; margin: 12px 0; }
      button { margin: 0; }
      li { margin: 8px 0; }
      .modified { color: #087f5b; }
      .verified { color: #1971c2; }
      .partial { color: #b7791f; }
      .failed { color: #c92a2a; }
    </style>
    <script>
      document.getElementById("file").onchange = async (event) => {
        const file = event.target.files?.[0];
        if (file) document.getElementById("json").value = await file.text();
      };
      document.getElementById("preview").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "preview", json: document.getElementById("json").value } }, "*");
      };
      document.getElementById("repair").onclick = () => {
        parent.postMessage({ pluginMessage: { type: "repair", json: document.getElementById("json").value } }, "*");
      };
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message?.type === "error") document.getElementById("summary").textContent = message.message;
        if (message?.type === "results") {
          const counts = message.results.reduce((acc, item) => {
            acc[item.status] = (acc[item.status] || 0) + 1;
            return acc;
          }, {});
          document.getElementById("summary").textContent = message.mode === "preview"
            ? `将修改 ${counts.modified || 0}，无需修改 ${counts.verified || 0}，需人工确认 ${counts.partial || 0}，无法处理 ${counts.failed || 0}`
            : `已修改 ${counts.modified || 0}，无需修改 ${counts.verified || 0}，部分处理 ${counts.partial || 0}，无法处理 ${counts.failed || 0}`;
          const list = document.getElementById("results");
          list.replaceChildren(...message.results.map((item) => {
            const row = document.createElement("li");
            row.className = item.status;
            const button = document.createElement("button");
            button.textContent = "定位";
            button.disabled = !item.figmaNodeId;
            button.onclick = () => parent.postMessage({ pluginMessage: { type: "select", nodeId: item.figmaNodeId } }, "*");
            const statusLabels = message.mode === "preview"
              ? { modified: "将修改", verified: "无需修改", partial: "需人工确认", failed: "无法处理" }
              : { modified: "已修改", verified: "无需修改", partial: "部分处理", failed: "无法处理" };
            const applied = message.mode === "repair" && item.appliedChanges?.length
              ? ` 已执行：${item.appliedChanges.join("、")}。`
              : "";
            row.append(button, document.createTextNode(` ${statusLabels[item.status]}：${item.nodeName}${applied} ${item.messages.join("；")}`));
            return row;
          }));
        }
      };
    </script>
  </body>
</html>
