<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>Pixso 设计系统迁移工具</title>
  </head>
  <body>
    <main>
      <h1>Pixso 设计系统迁移工具</h1>
      <p>能力检测会递归检查选中节点及其后代，再导出设计系统迁移数据。</p>
      <button id="probe">导出能力检测报告</button>
      <label>导出范围
        <select id="scope">
          <option value="selection">当前选择</option>
          <option value="artboard">选中的画板</option>
          <option value="page">当前页面</option>
        </select>
      </label>
      <label>每批根节点数量 <input id="batch-size" type="number" min="1" max="50" value="5"></label>
      <button id="export">导出迁移数据</button>
      <button id="cancel" disabled>取消</button>
      <p id="status" aria-live="polite"></p>
    </main>
    <style>
      body { font: 12px system-ui, sans-serif; margin: 16px; }
      main { display: grid; gap: 12px; }
      label { display: grid; gap: 4px; }
      button, select, input { min-height: 32px; }
    </style>
    <script>
      function saveJson(name, data) {
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      document.getElementById("probe").onclick = () => parent.postMessage({ pluginMessage: { type: "probe" } }, "*");
      document.getElementById("export").onclick = () => {
        document.getElementById("export").disabled = true;
        document.getElementById("cancel").disabled = false;
        parent.postMessage({ pluginMessage: {
          type: "export",
          scope: document.getElementById("scope").value,
          batchSize: Number(document.getElementById("batch-size").value)
        } }, "*");
      };
      document.getElementById("cancel").onclick = () =>
        parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (message?.type === "download-json") saveJson(message.name, message.data);
        if (message?.type === "export-progress")
          document.getElementById("status").textContent = `已导出第 ${message.completed}/${message.total} 批，共 ${message.nodeCount} 个节点`;
        if (message?.type === "error") document.getElementById("status").textContent = message.message;
        if (message?.type === "export-complete") document.getElementById("status").textContent = `导出完成，共 ${message.total} 批`;
        if (message?.type === "export-cancelled") document.getElementById("status").textContent = `已取消，完成 ${message.completed}/${message.total} 批`;
        if (["export-complete", "export-cancelled", "error"].includes(message?.type)) {
          document.getElementById("export").disabled = false;
          document.getElementById("cancel").disabled = true;
        }
      };
    </script>
  </body>
</html>
